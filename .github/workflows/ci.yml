name: CI

on:
  pull_request:
  push:
    branches: [main, production]

# Least privilege: jobs can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations + seed)
        # Only the services the tests use: Postgres, auth, REST, storage and the API gateway.
        run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase URL and keys
        run: npm run -s db:env >> "$GITHUB_ENV"
      - name: Seed demo images
        run: npm run seed:media
      - run: npm run lint
      - run: npm run format:check
      - name: Generated database types match the migrations
        run: npm run db:types && git diff --exit-code src/shared/supabase/database.types.ts
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm test
      - name: E2E fixture (publishes 2 demo gallery photos in the local DB)
        run: node tests/e2e/prepare-db.mts
      - run: npm run build
      - name: No secret keys in client bundles
        run: "! grep -rq sb_secret_ .next/static"
      - name: Install test browser
        # The runner image already has Chromium's system libraries; skipping apt avoids slow,
        # flaky Ubuntu mirrors (the only extras it would add are CJK/emoji fonts we don't use).
        run: npx playwright install chromium
      - run: npx playwright test
      - name: Lighthouse (accessibility, best practices, SEO ≥ 0.9; performance reported)
        run: npm run lighthouse
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            playwright-report/
            lighthouse-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
