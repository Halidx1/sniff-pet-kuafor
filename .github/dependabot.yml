# Monthly dependency PRs: keeps dependencies patched and the repo active, so GitHub doesn't
# disable scheduled workflows after 60 days without commits (PLAN §8 R3).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types follow the Node runtime (.nvmrc, Netlify): bumped by hand with Node itself.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript majors wait until the toolchain (typescript-eslint, Next) supports them.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
