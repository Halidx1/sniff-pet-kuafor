# Monthly dependency PRs: keeps dependencies patched and the repo active, so GitHub doesn't
# disable scheduled workflows after 60 days without commits (PLAN §8 R3).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
